version: 2
updates:
  # Backend Python dependencies - monthly to reduce noise
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
      day: "1st"
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "pip-audit"
          - "alembic"
      runtime-dependencies:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "sqlalchemy"
          - "psycopg*"
          - "httpx"
    ignore:
      # Block major version bumps that require code changes
      - dependency-name: "sqlalchemy"
        versions: ["2.x"]
      - dependency-name: "fastapi"
        versions: ["0.x"]

  # Frontend npm dependencies - monthly
  - package-ecosystem: "npm"
    directory: "/frontend-v2"
    schedule:
      interval: "monthly"
      day: "1st"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # Block major version bumps that require Astro migrations
      - dependency-name: "astro"
        versions: ["4.x", "5.x", "6.x", "7.x"]
      - dependency-name: "@astrojs/*"
        versions: ["4.x", "5.x", "6.x", "7.x"]
      - dependency-name: "next"
        versions: ["14.x", "15.x"]

  # GitHub Actions - monthly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "1st"
    open-pull-requests-limit: 3
    ignore:
      # Pin major versions that require workflow file changes
      - dependency-name: "actions/checkout"
        versions: ["5.x", "6.x", "7.x"]
      - dependency-name: "actions/setup-node"
        versions: ["5.x", "6.x", "7.x"]
      - dependency-name: "actions/setup-python"
        versions: ["6.x", "7.x"]
