version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "pip-audit"
          - "alembic"
      runtime-dependencies:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "sqlalchemy"
          - "psycopg*"
          - "httpx"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend-v2"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
