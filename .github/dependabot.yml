version: 2
updates:
  # Backend Python dependencies - monthly to reduce noise
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
      day: "1st"
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "pip-audit"
          - "alembic"
      runtime-dependencies:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "sqlalchemy"
          - "psycopg*"
          - "httpx"
    ignore:
      # Block major version bumps that require code changes
      - dependency-name: "sqlalchemy"
        versions: ["3.x"]
      - dependency-name: "fastapi"
        versions: ["1.x"]

  # Frontend npm dependencies - monthly
  - package-ecosystem: "npm"
    directory: "/frontend-v2"
    schedule:
      interval: "monthly"
      day: "1st"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # Block major version bumps that require Astro migrations
      - dependency-name: "astro"
        versions: ["8.x"]
      - dependency-name: "@astrojs/*"
        versions: ["8.x"]

  # GitHub Actions - monthly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "1st"
    open-pull-requests-limit: 3
