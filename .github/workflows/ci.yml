name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: Lint + Test ──────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swastha
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: swastha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swastha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tools
        run: pip install ruff pip-audit pytest-cov

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with SQLite (coverage)
        run: python -m pytest -v --tb=short --cov=. --cov-report=term --cov-report=xml
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: development
          GEMINI_API_KEY: fake-key-for-ci
          GEMINI_MODEL: gemini-3.8-flash

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ─── Frontend: Type-check + Build ─────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-v2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check with astro check
        run: npx astro check

      - name: Build
        run: npm run build
        env:
          PUBLIC_API_BASE_URL: https://swasthatrack-api.onrender.com/api
          SITE_URL: https://swasthatrack.vercel.app
          PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

  # ─── Docker: Verify image builds ──────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t swasthatrack-api ./backend
