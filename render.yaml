# Render Blueprint — Infrastructure as Code
# Deploy with: Dashboard > New > Blueprint > Connect your GitHub repo
# Docs: https://docs.render.com/blueprint-spec

databases:
  - name: swasthatrack-db
    plan: free  # 1 GB, 90-day limit on free; upgrade to starter ($7/mo) for permanent
    databaseName: swasthatrack
    user: swasthatrack_user
    region: singapore  # closest to India

services:
  - type: web
    name: swasthatrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free  # 512 MB RAM, shared CPU
    healthCheckPath: /health
    envVars:
      # Database — auto-populated from the database defined above
      - key: DATABASE_URL
        fromDatabase:
          name: swasthatrack-db
          property: connectionString
      # App config
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true  # Render generates a secure random string
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: "https://swasthatrack.vercel.app"  # Update after Vercel deploy
      # AI Triage — set manually in Render dashboard (secret)
      - key: GEMINI_API_KEY
        sync: false  # must be set manually in dashboard
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      # Gunicorn
      - key: WEB_CONCURRENCY
        value: "2"  # Free tier has limited RAM; keep workers low
      - key: PORT
        value: "8000"
