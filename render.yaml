# Render Blueprint — Infrastructure as Code
# Deploy with: Dashboard > New > Blueprint > Connect your GitHub repo
# Docs: https://docs.render.com/blueprint-spec

# Databases are now provisioned externally (e.g. Neon). DATABASE_URL is set
# manually in the Render dashboard.

services:
  - type: web
    name: swasthatrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free  # 512 MB RAM, shared CPU
    healthCheckPath: /health
    envVars:
      # Database — set manually in Render dashboard (external provider, e.g. Neon)
      - key: DATABASE_URL
        sync: false  # must be set manually in dashboard
      # App config
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true  # Render generates a secure random string
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: "https://swasthatrack.vercel.app"  # Update after Vercel deploy
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        value: "83227092467-e04krla6f1j9o8crv6qkmjdm4tobi30m.apps.googleusercontent.com"
      - key: SUPERADMIN_EMAILS
        value: "akshayislesnar@gmail.com"
      # AI Triage — set manually in Render dashboard (secret)
      - key: GEMINI_API_KEY
        sync: false  # must be set manually in dashboard
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      # Gunicorn
      - key: WEB_CONCURRENCY
        value: "2"  # Free tier has limited RAM; keep workers low
      - key: PORT
        value: "8000"
